[project]
name = "revenue-desk"
version = "0.1.0"
description = "Self-adapting revenue accounting agents on WidgeX harnesses"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pypdf>=4.0",
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.2",
    "pyyaml>=6.0",
    "reportlab>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
