# Which event kinds each role may write. Patterns use shell-style wildcards.
# This is the code-level half of segregation of duties: an agent running as
# `intake` cannot approve anything or post to the books, whatever its prompt says.

# Kinds every agent role may write.
[common]
kinds = ["feedback.recorded", "check.result", "workflow.proposed", "workflow.validated",
         "workflow.adopted", "workflow.rejected", "note.*"]

[roles.architect]
kinds = ["structure.*"]

[roles.intake]
kinds = ["mail.received", "mail.classified",
         "quote.received", "quote.extracted", "quote.conflict", "quote.clarified",
         "quote.amended", "quote.rejected", "quote.duplicate", "approval.requested"]

[roles.orders]
kinds = ["so.drafted", "so.amended", "so.cancelled", "po.drafted", "po.amended", "po.cancelled",
         "approval.requested", "erp.staged", "erp.posted", "erp.failed"]

[roles.billing]
kinds = ["invoice.drafted", "bill.received", "bill.matched", "bill.mismatch",
         "approval.requested", "erp.staged", "erp.posted", "erp.failed", "je.posted"]

[roles.cash]
kinds = ["payment.received", "payment.applied", "payment.short", "payment.over",
         "payment.unmatched", "billpayment.drafted", "billpayment.sent",
         "approval.requested", "erp.staged", "erp.posted", "erp.failed", "je.posted"]

[roles.reconcile]
kinds = ["recon.*", "approval.requested"]

# Prices RFQs: records its judgement calls, runs the model (which records the recommendation), and
# emails finance. It cannot approve a price or send a quote to a customer.
[roles.pricing]
kinds = ["pricing.assessment", "pricing.recommended", "pricing.model_fitted", "pricing.outcome",
         "mail.sent", "approval.requested"]

# Sends the customer the quote finance approved (connectors/mailer.py refuses an unapproved one).
[roles.quoting]
kinds = ["quote.sent", "mail.sent"]

# Finance approves or changes a price recommendation, by replying to the report email. The reply is
# parsed in code (desk/finance_reply.py), and is written --on-behalf-of human:<their address>.
[roles.finance]
kinds = ["approval.granted", "approval.rejected", "feedback.recorded"]
human = true

# The hard-transition checks in checks/ledger_checks.py. Code, not an agent.
[roles.checker]
kinds = ["check.result"]

# Pulls what changed in Odoo and at the bank. Writes nothing to either.
[roles.tracker]
kinds = ["erp.changed", "bank.transaction"]

# The controller is a person (or a model playing the approver). Approvals must
# be written with --on-behalf-of human:<name>, and are refused if that actor
# created or drafted the thing being approved.
[roles.controller]
kinds = ["approval.granted", "approval.rejected", "feedback.recorded"]
human = true

# Seed and simulation scripts. Everything they write is labelled simulated.
[roles.simulator]
kinds = ["sim.*"]

# What must already be true before an entity type may be posted (confirmed) in the books.
#   approved                   an approval.granted after its latest draft/amend
#   parent_approved:<rel>      the entity it links to via <rel> is approved
#   matched_or_approved:<rel>  a bill.matched or approval.granted on it, and its parent is posted
#   none                       no gate
[posting]
so = "approved"
po = "approved"
invoice = "parent_approved:from_so"
bill = "matched_or_approved:from_po"
payment = "none"
billpayment = "approved"   # whoever requests a payment can't be the one who approves it
